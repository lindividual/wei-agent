<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-web-shell</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #16181d;
    --panel: #1d2027;
    --line: #2b2f39;
    --text: #dfe3ea;
    --dim: #8b93a1;
    --accent: #6ea8fe;
    --warn: #e06c75;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  #app { height: 100%; }

  .app { display: flex; height: 100%; }

  /* ── turn anchors ── */
  .rail {
    flex: 0 0 52px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail-title {
    color: var(--dim);
    font: 12px var(--mono);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    width: 26px;
    text-align: center;
  }
  .dot {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: #262a33;
    color: var(--dim);
    font: 11px var(--mono);
    text-decoration: none;
    transition: background .12s, color .12s;
  }
  .dot:hover { background: var(--accent); color: #14161a; }

  /* ── conversation ── */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .stream { flex: 1; overflow-y: auto; padding: 24px 28px 8px; }
  .exchange {
    max-width: 860px;
    margin: 0 auto 28px;
    scroll-margin-top: 16px;
  }
  .user {
    background: #232833;
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .block { margin: 10px 0; }

  .thinking, .tool {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #1a1d23;
    overflow: hidden;
  }
  .thinking > summary, .tool > summary {
    cursor: pointer;
    padding: 7px 12px;
    color: var(--dim);
    font-size: 13px;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .thinking > summary::before { content: "💭"; }
  .tool > summary::before { content: "🔧"; }
  .tool.error > summary::before { content: "⚠️"; }
  .thinking > summary:hover, .tool > summary:hover { color: var(--text); }
  .tool.error { border-color: #5a2e33; }
  .tool.error > summary { color: var(--warn); }

  .thinking .body {
    padding: 4px 12px 12px;
    color: var(--dim);
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid var(--line);
    max-height: 340px;
    overflow-y: auto;
  }
  pre {
    margin: 0;
    padding: 10px 12px;
    background: #14161a;
    border-top: 1px solid var(--line);
    overflow-x: auto;
    font: 12.5px/1.5 var(--mono);
    color: #c8cdd6;
  }
  pre.result { max-height: 420px; overflow-y: auto; }
  .result.empty { padding: 8px 12px; color: var(--dim); font-size: 13px; }
  code { font-family: var(--mono); }

  .md { word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3 { margin: 1.1em 0 .5em; line-height: 1.3; }
  .md h1 { font-size: 1.35em; }
  .md h2 { font-size: 1.2em; }
  .md h3 { font-size: 1.05em; }
  .md p { margin: .6em 0; }
  .md ul, .md ol { margin: .6em 0; padding-left: 1.5em; }
  .md li { margin: .25em 0; }
  .md a { color: var(--accent); }
  .md code {
    background: #23262e;
    padding: .12em .38em;
    border-radius: 3px;
    font-size: .9em;
  }
  .md pre {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin: .7em 0;
    border-top: 1px solid var(--line);
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote {
    margin: .7em 0;
    padding-left: 12px;
    border-left: 3px solid var(--line);
    color: var(--dim);
  }
  .md table { border-collapse: collapse; margin: .7em 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }
  .md img { max-width: 100%; }

  .pending {
    max-width: 860px;
    margin: 0 auto 20px;
    color: var(--dim);
    font-size: 13px;
  }
  .pending::after {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: .2; } }

  /* ── composer ── */
  .composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 28px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input {
    flex: 1;
    resize: none;
    background: #14161a;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font: inherit;
    outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .send {
    background: var(--accent);
    color: #14161a;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font: 600 14px inherit;
    cursor: pointer;
  }
  .send:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>
<div id="app"></div>
<script src="web.js"></script>
</body>
</html>
